name: Build Aragorn Army of the Dead
on:
  push:
    branches: [main]
    paths:
      - 'Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate German and English localization
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_localization.py"
      - name: Validate approved sword crypt map
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_sword_crypt.py"
      - name: Validate bombardier ritual crypt layout and stages
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_bombardier_crypt.py"
      - name: Validate all six oath sarcophagus trials
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_oath_graves.py"
      - name: Validate unobstructed trial building footprints
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_quest_footprints.py"
      - name: Validate vaulted crypt rooms, fog and tactical guard positions
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_crypt_architecture.py"
      - name: Validate Aragorn rescue moat, bridge and nested prison
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_rescue_moat_fortress.py"
      - name: Validate empty rescue/forge map automatic recovery
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_empty_quest_recovery.py"
      - name: Validate roof coverage and shaped crypt ground
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/validate_roof_coverage.py"
      - name: Compile RimWorld 1.6 assembly
        run: dotnet build "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/Aragorn_ArmyOfTheDead/Source/Aragorn_ArmyOfTheDead.csproj" -c Release --nologo
      - name: Package complete installable mod with original folder
        run: python "Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/scripts/package_mod.py"
      - name: Upload correctly named installable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aragorn_Armee_der_Toten_v0.39.2_Leere_Karten_Schmied_Rettung_Hotfix_Komplettmod(1)
          path: Aragorn_ArmyOfTheDead_Entwicklungsprojekt_v0_1/dist/Aragorn_Armee_der_Toten_v0.39.2_Leere_Karten_Schmied_Rettung_Hotfix_Komplettmod(1).zip
          if-no-files-found: error
